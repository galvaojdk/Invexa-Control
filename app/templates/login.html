{% extends "auth_base.html" %}

{% block title %}Login - Invexa Control{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md bg-[#0f172a] border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-gradient-to-br from-emerald-500 to-blue-600 rounded-xl shadow-lg mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <h1
                class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-500 mb-2">
                Invexa Control</h1>
            <h2 class="text-xl font-bold text-white">Bem-vindo de volta!</h2>
            <p class="text-slate-400 mt-2">Acesse sua conta para gerenciar seu estoque.</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            {% if error %}
            <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm text-center">
                {{ error }}
            </div>
            {% endif %}
            <div>
                <label class="block text-slate-400 text-xs font-bold mb-1.5 uppercase tracking-wide">E-mail</label>
                <input type="email" name="email"
                    class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="seu@email.com" required>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide">Senha</label>
                    <a href="#" class="text-[10px] text-blue-400 hover:text-blue-300">Esqueceu a senha?</a>
                </div>
                <input type="password" name="password"
                    class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="••••••••" required>
            </div>

            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition-all transform active:scale-[0.98]">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-8 text-center pt-6 border-t border-slate-800">
            <p class="text-sm text-slate-400">Não tem uma conta? <a href="/register"
                    class="text-blue-400 font-bold hover:text-blue-300 transition-colors">Crie agora</a></p>
        </div>
    </div>
</div>

{% endblock %}
