<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invexa Control{% endblock %}</title>

    <!-- Theme Management -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        secondary: '#6366f1', // Indigo 500
                        dark: '#09090b', // Zinc 950
                        darker: '#000000', // Black
                        surface: '#18181b', // Zinc 900
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, var(--primary-alpha), transparent 50%);
            min-height: 100vh;
        }

        /* Utility for auth pages alpha */
        :root {
            --primary-alpha: rgba(16, 185, 129, 0.1);
        }

        html.dark {
            --primary-alpha: rgba(16, 185, 129, 0.15);
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="bg-main text-main font-sans antialiased selection:bg-primary/30 selection:text-primary">
    <div class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[100px]">
            </div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-500/5 rounded-full blur-[100px]">
            </div>
        </div>

        <main class="w-full max-w-md z-10 animate-slide-up">
            {% block content %}{% endblock %}
        </main>

        <footer class="mt-8 text-center text-zinc-500 text-xs z-10 animate-fade-in" style="animation-delay: 0.2s;">
            <p>&copy; {{ now().year if now else '2024' }} Invexa Control. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>

</html>
