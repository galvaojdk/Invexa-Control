<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invexa Control{% endblock %}</title>

    <!-- Theme Management -->
    <script>
        // Inicialização imediata do tema: Tema claro como padrão
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#6366f1',
                        main: 'rgb(var(--text-main) / <alpha-value>)',
                        muted: 'rgb(var(--text-muted) / <alpha-value>)',
                        dark: 'rgb(var(--bg-main) / <alpha-value>)',
                        darker: 'rgb(var(--bg-main) / <alpha-value>)',
                        surface: 'rgb(var(--bg-surface) / <alpha-value>)',
                        glass: 'rgb(var(--glass) / <alpha-value>)',
                        border: 'rgb(var(--border) / <alpha-value>)',
                        'input-bg': 'rgb(var(--input-bg) / <alpha-value>)',
                        'input-text': 'rgb(var(--input-text) / <alpha-value>)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-main: 248 250 252;
            --bg-surface: 255 255 255;
            --text-main: 15 23 42;
            --text-muted: 71 85 105;
            --border: 226 232 240;
            --glass: 255 255 255;
            --input-bg: 255 255 255;
            --input-text: 15 23 42;
            --input-border: 203 213 225;
            --primary-alpha: rgba(16, 185, 129, 0.1);
        }

        .dark {
            --bg-main: 9 9 11;
            --bg-surface: 24 24 27;
            --text-main: 244 244 245;
            --text-muted: 161 161 170;
            --border: 39 39 42;
            --glass: 24 24 27;
            --input-bg: 9 9 11;
            --input-text: 244 244 245;
            --input-border: 63 63 70;
            --primary-alpha: rgba(16, 185, 129, 0.15);
        }

        body {
            background-color: rgb(var(--bg-main));
            background-image: radial-gradient(circle at 50% 0%, var(--primary-alpha), transparent 50%);
            min-height: 100vh;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="bg-main text-main font-sans antialiased selection:bg-primary/30 selection:text-primary">
    <div class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[100px]">
            </div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-500/5 rounded-full blur-[100px]">
            </div>
        </div>

        <main class="w-full max-w-md z-10 animate-slide-up">
            {% block content %}{% endblock %}
        </main>

        <footer class="mt-8 text-center text-muted text-xs z-10 animate-fade-in" style="animation-delay: 0.2s;">
            <p>&copy; {{ now().year if now else '2024' }} Invexa Control. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>

</html>
