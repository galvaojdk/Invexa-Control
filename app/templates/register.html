{% extends "auth_base.html" %}

{% block title %}Cadastro - Invexa Control{% endblock %}

{% block content %}
<div class="bg-surface border border-border rounded-2xl shadow-2xl p-6 w-full relative overflow-hidden group">
    <!-- Decorator -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-indigo-600"></div>

    <div class="text-center mb-6 relative z-10">
        <h2 class="text-xl font-bold text-main tracking-tight">Criar Conta</h2>
        <p class="text-muted text-xs mt-1">Comece a gerenciar seu almoxarifado agora.</p>
    </div>

    <form action="/register" method="POST" class="space-y-4 relative z-10">
        <div>
            <label class="block text-muted text-[10px] font-bold mb-1.5 uppercase tracking-widest">Nome
                Completo</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <input type="text" name="full_name"
                    class="w-full bg-darker/50 border border-border text-main rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary/50 outline-none transition-all placeholder-muted"
                    placeholder="Ex: João Silva" required>
            </div>
        </div>
        <div>
            <label class="block text-muted text-[10px] font-bold mb-1.5 uppercase tracking-widest">E-mail</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207">
                        </path>
                    </svg>
                </div>
                <input type="email" name="email"
                    class="w-full bg-darker/50 border border-border text-main rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary/50 outline-none transition-all placeholder-muted"
                    placeholder="seu@email.com" required>
            </div>
        </div>
        <div>
            <label class="block text-muted text-[10px] font-bold mb-1.5 uppercase tracking-widest">Senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </div>
                <input type="password" name="password"
                    class="w-full bg-darker/50 border border-border text-main rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary/50 outline-none transition-all placeholder-muted"
                    placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit"
            class="w-full py-3 bg-gradient-to-r from-emerald-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 transition-all transform active:scale-[0.98] border border-white/10 relative overflow-hidden group">
            <span class="relative z-10 flex items-center justify-center gap-2">
                Criar Minha Conta
                <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6">
                    </path>
                </svg>
            </span>
            <div
                class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
            </div>
        </button>
    </form>

    <div class="mt-6 text-center pt-4 border-t border-border relative z-10">
        <p class="text-xs text-muted">Já tem uma conta? <a href="/login"
                class="text-primary font-bold hover:text-primary transition-colors">Fazer Login</a></p>
    </div>
</div>
{% endblock %}
