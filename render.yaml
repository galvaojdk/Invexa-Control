services:
  - type: web
    name: invexa-control
    runtime: docker
    plan: free
    region: ohio
    startCommand: "bash migrate.sh && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: control-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true

databases:
  - name: control-db
    databaseName: invexa_control
    user: invexa_user
    plan: basic-256mb # ~$7/month (New Flexible Plan)
    region: ohio
