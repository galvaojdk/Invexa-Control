<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Invexa Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        secondary: '#6366f1', // Indigo 500
                        dark: '#09090b', // Zinc 950
                        darker: '#000000', // Black
                        surface: '#18181b', // Zinc 900
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            min-height: 100vh;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="bg-dark text-zinc-300 font-sans antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[100px]">
            </div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-500/5 rounded-full blur-[100px]">
            </div>
        </div>

        <main class="w-full max-w-md z-10 animate-slide-up">
            
<div
    class="bg-surface/30 backdrop-blur-xl border border-white/5 rounded-2xl shadow-2xl p-8 w-full relative overflow-hidden group">
    <!-- Decorator -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-indigo-600"></div>

    <div class="text-center mb-8 relative z-10">
        <div
            class="inline-flex p-3 bg-gradient-to-br from-emerald-500 to-indigo-600 rounded-xl shadow-lg shadow-indigo-500/20 mb-4 ring-4 ring-white/5">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
        </div>
        <h1
            class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400 mb-2 tracking-tight">
            Invexa Control</h1>
        <h2 class="text-lg font-medium text-zinc-300">Bem-vindo de volta!</h2>
        <p class="text-zinc-500 text-sm mt-1">Acesse sua conta para gerenciar seu estoque.</p>
    </div>

    <form action="/login" method="POST" class="space-y-5 relative z-10">
        
        <div>
            <label class="block text-zinc-500 text-[10px] font-bold mb-1.5 uppercase tracking-widest">E-mail</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207">
                        </path>
                    </svg>
                </div>
                <input type="email" name="email"
                    class="w-full bg-dark/50 border border-white/10 text-white rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 outline-none transition-all placeholder-zinc-700"
                    placeholder="seu@email.com" required>
            </div>
        </div>
        <div>
            <div class="flex justify-between items-center mb-1.5">
                <label class="block text-zinc-500 text-[10px] font-bold uppercase tracking-widest">Senha</label>
                <a href="#"
                    class="text-[10px] text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Esqueceu a
                    senha?</a>
            </div>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </div>
                <input type="password" name="password"
                    class="w-full bg-dark/50 border border-white/10 text-white rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 outline-none transition-all placeholder-zinc-700"
                    placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit"
            class="w-full py-3 bg-gradient-to-r from-emerald-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 transition-all transform active:scale-[0.98] border border-white/10 relative overflow-hidden group">
            <span class="relative z-10 flex items-center justify-center gap-2">
                Entrar no Sistema
                <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6">
                    </path>
                </svg>
            </span>
            <div
                class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
            </div>
        </button>
    </form>

    <div class="mt-8 text-center pt-6 border-t border-white/5 relative z-10">
        <p class="text-sm text-zinc-500">Não tem uma conta? <a href="/register"
                class="text-indigo-400 font-bold hover:text-indigo-300 transition-colors">Crie agora</a></p>
    </div>
</div>

        </main>

        <footer class="mt-8 text-center text-zinc-500 text-xs z-10 animate-fade-in" style="animation-delay: 0.2s;">
            <p>&copy; 2024 Invexa Control. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>

</html>
